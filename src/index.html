<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <title>GFS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#111c30" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#080e19" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplikacija na telefonu (spec „Aplikacija i obaveštenja“ 4.1): manifest dodaju tek prijavljeni delovi (core/pwa/manifest.ts),
       pa ga upis, uživo i prijava nemaju. Ikonica i ime za iPhone važe svuda. -->
  <link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="GFS">
  <script>
    // Režim dan/noć pre prvog renderovanja (bez treptanja). Isti ključ i pravila kao PreferencesStore.
    (function () {
      var html = document.documentElement;
      var rezim = 'sistem';
      try {
        var p = JSON.parse(localStorage.getItem('gfs.prefs.v1') || 'null');
        if (p && (p.rezim === 'dan' || p.rezim === 'noc')) rezim = p.rezim;
      } catch (e) { /* oštećeno ili nedostupno: sistem */ }
      if (rezim === 'sistem') {
        rezim = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'noc' : 'dan';
      }
      html.setAttribute('data-mode', rezim);
      html.style.colorScheme = rezim === 'noc' ? 'dark' : 'light';
    })();
    // Ponuda za instalaciju (Chrome i ostali Chromium browseri) može da stigne pre nego što se Angular podigne: čuva se ovde,
    // a core/pwa/instalacija.ts je preuzima. preventDefault gasi browserovu traku; ponudu prikazuje kartica na nalogu.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__gfsPonudaInstalacije = e;
    });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
