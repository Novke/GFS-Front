# nginx u frontend kontejneru: služi Angular build i proxy-uje /api ka backendu.
worker_processes 1;
events { worker_connections 256; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  # Protokol klijenta: host nginx (TLS) šalje X-Forwarded-Proto, direktan pristup kontejneru nema pa ide $scheme.
  # Backend po tome postavlja Secure na kolačić studenta (gfs_uzivo).
  map $http_x_forwarded_proto $gfs_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Upload slika (uživo): backend dozvoljava 10 MB fajl (max-request-size 11 MB), nginx podrazumevano staje na 1 MB (413).
    client_max_body_size 11m;

    # WebSocket (uživo): nastavnički ulaz iza basic-auth-a na host nginx-u, studentski javni (/api/public/).
    # Tačno poklapanje ima prednost nad ^~ /api/ ispod.
    location = /api/ws {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }
    location = /api/public/ws {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }

    # Docker DNS + varijabla: nginx se podiže i bez backenda i ponovo razrešava ime posle njegovog restarta.
    location ^~ /api/ {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
    }

    # Dugi keš samo za heširane build fajlove u korenu i u media/ (application builder, Angular 17+): main-4GOMCQ2O.js,
    # styles-TI5ZISUJ.css, lenji chunk-ovi sa base64url hešom (chunk-CtOh0Kox.js, chunk-_fBU7IqW.js, chunk-CX-p9k8t.js),
    # fontovi media/ibm-plex-sans-latin-400-normal-COQVXTP6.woff2; stari webpack builder: main.1a2b3c4d5e6f7a8b.js.
    # Nepostojeći heširan fajl je 404 (ne index.html). Sve ostalo (index.html, favicon.ico, assets/...) ide u location / bez keša.
    # Izraz je isti kao DUGI_KES_IZRAZ u e2e/javne-putanje.ts (proverava e2e/javne-putanje.spec.ts nad pravim buildom).
    # Pod navodnicima jer nginx inače {8,} čita kao blok; bez ~* (velika i mala slova su deo heša).
    location ~ "^/(media/)?[A-Za-z0-9_.-]+(\.[0-9a-f]{8,}|-[A-Za-z0-9_-]{8})\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }
  }
}
