# nginx u frontend kontejneru: služi Angular build i proxy-uje /api ka backendu.
worker_processes 1;
events { worker_connections 256; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;
  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Docker DNS + varijabla: nginx se podiže i bez backenda i ponovo razrešava ime posle njegovog restarta.
    location /api/ {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashovani asseti smeju dugo u keš; index.html nikad.
    location ~* \.(js|css|woff2?|png|ico|svg)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }
  }
}
