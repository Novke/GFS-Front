# nginx u frontend kontejneru: služi Angular build i proxy-uje /api ka backendu.
worker_processes 1;
events { worker_connections 256; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

  # Protokol klijenta: host nginx (TLS) šalje X-Forwarded-Proto, direktan pristup kontejneru nema pa ide $scheme.
  # Backend po tome postavlja Secure na kolačić studenta (gfs_uzivo).
  map $http_x_forwarded_proto $gfs_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Upload slika (uživo): backend dozvoljava 10 MB fajl (max-request-size 11 MB), nginx podrazumevano staje na 1 MB (413).
    client_max_body_size 11m;

    # WebSocket (uživo): nastavnički ulaz iza basic-auth-a na host nginx-u, studentski javni (/api/public/).
    # Tačno poklapanje ima prednost nad ^~ /api/ ispod.
    location = /api/ws {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }
    location = /api/public/ws {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }

    # Docker DNS + varijabla: nginx se podiže i bez backenda i ponovo razrešava ime posle njegovog restarta.
    location ^~ /api/ {
      resolver           127.0.0.11 valid=10s;
      set                $backend http://backend:8080;
      rewrite            ^/api/(.*)$ /$1 break;
      proxy_pass         $backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $gfs_proto;
    }

    # Dugi keš samo za hashovane build fajlove: application builder (Angular 17+) daje main-UDGHCXXQ.js,
    # chunk-ABCD1234.js, styles-URZGUP5K.css; stari webpack builder je davao main.1a2b3c4d5e6f7a8b.js.
    # Sve ostalo (index.html, favicon.ico, assets/...) ide u location / bez keša.
    # Regex je pod navodnicima jer nginx inače {8,} čita kao blok; bez ~* (velika slova su deo heša).
    location ~ "(\.[0-9a-f]{8,}|-[0-9A-Z]{8})\.(js|css|woff2?|png|jpe?g|gif|svg|ico)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }
  }
}
