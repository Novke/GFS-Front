name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npx ng lint
      - name: Testovi sopstvenih ESLint pravila (javna ruta, granice feature-a)
        run: npm run test:eslint-pravila
      - name: Unit testovi (Vitest)
        run: npx ng test --watch=false
      - name: Produkcioni build
        run: npx ng build --configuration production
      - name: Provera Dockerfile-a
        run: docker build -t gfs-frontend-ci .
