name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npx ng lint
      - name: Testovi sopstvenih ESLint pravila (javna ruta, granice feature-a)
        run: npm run test:eslint-pravila
      - name: Unit testovi (Vitest)
        run: npx ng test --watch=false
      - name: Produkcioni build
        run: npx ng build --configuration production
      - name: E2E pregledač (Chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, mokovan API, axe dan i noć)
        run: |
          npx tsc -p e2e/tsconfig.json
          npx playwright test
      - name: Izveštaj E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izvestaj
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Provera Dockerfile-a
        run: docker build -t gfs-frontend-ci .
